version: '3.8'

services:
  eavi-college:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      # Mount storage directory for file uploads
      - ./storage:/app/storage
      # Mount logs directory
      - ./logs:/app/logs
      # For production, you might want to use a named volume
    restart: unless-stopped
    user: "1001:1001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Reverse proxy (Nginx) for HTTPS and better performance
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - eavi-college
    restart: unless-stopped

volumes:
  storage:
  logs: